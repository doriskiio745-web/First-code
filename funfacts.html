<!DOCTYPE html>
<html><head><title>Fun Facts</title>
<style>body{font-family:Arial;text-align:center;background:linear-gradient(to right,#ff9a9e,#fecfef);padding:50px}.card{background:white;padding:30px;border-radius:20px;max-width:500px;margin:auto}button{padding:15px 30px;font-size:18px;background:#ff6b6b;color:white;border:none;border-radius:10px}#fact{font-size:20px;margin:20px}</style>
</head><body><div class="card">
<h1>Random Fun Facts</h1>
<p id="fact">Click button for fact!</p>
<button onclick="newFact()">Get Fun Fact</button>
</div><script>
const facts=["Octopuses have 3 hearts!","Honey never spoils!","Bananas are berries!","Water can boil and freeze same time!","More trees than stars in galaxy!"];
function newFact(){document.getElementById('fact').innerText=facts[Math.floor(Math.random()*facts.length)];}
</script></body></html>
