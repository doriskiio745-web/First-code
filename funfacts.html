<!DOCTYPE html>
<html>
<head>
<title>Fun Facts</title>
<style>
body{font-family:Arial;text-align:center;background:#ff69b4;padding:40px}
.card{background:white;padding:30px;border-radius:20px;max-width:400px;margin:auto;box-shadow:0 5px 15px rgba(0,0,0,0.2)}
button{background:#ff1493;color:white;border:none;padding:15px 25px;border-radius:10px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>Random Fun Facts</h1>
<p id="fact">Click button for fact!</p>
<button onclick="newFact()">Get Fun Fact</button>
</div>
<script>
const facts=["Octopuses have 3 hearts!","Honey never spoils!","Bananas are berries!","Wombat poop is cube-shaped!","Octopuses have blue blood!"];
function newFact(){document.getElementById('fact').innerText=facts[Math.floor(Math.random()*facts.length)]}
</script>
</body>
</html>
