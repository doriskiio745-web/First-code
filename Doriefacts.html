<!DOCTYPE html>
<html>
<head>
<title>Dorie Facts - Nandi</title>
<style>
body{font-family:Arial;text-align:center;background:#a855f7;padding:40px}
.card{background:white;padding:30px;border-radius:20px;max-width:400px;margin:auto;box-shadow:0 5px 15px rgba(0,0,0,0.2)}
button{background:#7e22ce;color:white;border:none;padding:15px 25px;border-radius:10px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>Fun Facts from Nandi 🇰🇪</h1>
<p id="fact">Click below - built from my phone!</p>
<button onclick="newFact()">Get My Fact</button>
<p style="margin-top:20px;font-size:12px;color:gray">Built by Doris - 11 to 22 lines journey!</p>
</div>
<script>
const facts=[
"Nandi Hills has the best tea in Kenya!",
"I built this website from my phone in Nandi!",
"My first code was 11 lines and blank - now 22 lines and PINK!",
"Chepsangor hills are beautiful at sunrise!",
"From WhatsApp to GitHub - I did it!"
];
function newFact(){document.getElementById('fact').innerText=facts[Math.floor(Math.random()*facts.length)]}
</script>
</body>
</html>
